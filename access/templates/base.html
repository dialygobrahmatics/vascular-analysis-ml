<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dialygo-Access{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <span class="brand">Dialygo-Access</span>
    <span class="tag">Research only &middot; not for treating patients</span>
    <span class="spacer"></span>
    {% if user %}<span class="muted">Reviewer: {{ user.username }}</span> <a href="{{ url_for('studies') }}">Studies</a> <a href="{{ url_for('change_reviewer') }}">Change reviewer</a>{% endif %}
  </header>
  <main>{% block body %}{% endblock %}</main>
  <script src="{{ url_for('static', filename='feedback.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
