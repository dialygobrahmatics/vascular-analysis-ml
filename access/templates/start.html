{% extends "base.html" %}
{% block body %}
<div class="card" style="max-width:420px;margin:40px auto">
  <h1>Who is reviewing?</h1>
  <p class="muted small">Your name is recorded with every change you make and on the reports you sign.
  This app runs only on this computer; patient images never leave it.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <p><input name="name" placeholder="Your full name, e.g. Dr. G. Gireesh Reddy" autofocus required style="width:100%"></p>
    <button type="submit">Continue</button>
  </form>
</div>
{% endblock %}
